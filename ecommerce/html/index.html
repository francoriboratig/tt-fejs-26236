<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DQIIIBuilder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/b855d4377f.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <header class="dq3header">
      <img
        src="../../Recursos/dq3logo.webp"
        alt="Logo de Dragon Quest 3"
        width="400"
        height="170"
      />
      <nav>
        <ul class="dq3nav">
          <li><a href="./index.html">Inicio</a></li>
          <li><a href="./pages/carrito.html">Carrito</a></li>
          <li><a href="./pages/contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="carCardContainer">
        <article class="carCard">
          <img
            src="../../Recursos/hotwheels/Team_Transport_-70_1.webp"
            alt="Team Transport 70 1"
          />
          <h1>Team Transport 70</h1>
          <h2>Blue</h2>
          <button class="btn">
            Agregar al Carrito
            <i class="fa-solid fa-cart-shopping" style="color: white"> </i>
          </button>
        </article>
        <article class="carCard">
          <img
            src="../../Recursos/hotwheels/SauberFlyer.webp"
            alt="Sauber Flyer"
          />
          <h1>Sauber Flyer</h1>
          <h2>Black</h2>
          <button class="btn">
            Agregar al Carrito
            <i class="fa-solid fa-cart-shopping" style="color: white"> </i>
          </button>
        </article>
        <article class="carCard">
          <img
            src="../../Recursos/hotwheels/1988ChevroletSilverado3500.webp"
            alt="Chevrolet Silverado 3500"
          />
          <h1>Chevrolet Silverado 3500</h1>
          <h2>White</h2>
          <button class="btn">
            Agregar al Carrito
            <i class="fa-solid fa-cart-shopping" style="color: white"> </i>
          </button>
        </article>
        <article class="carCard">
          <img
            src="../../Recursos/hotwheels/RenndienstCarrier.webp"
            alt=" Renndienst Carrier"
          />
          <h1>Renndienst Carrier</h1>
          <h2>White</h2>
          <button class="btn">
            Agregar al Carrito
            <i class="fa-solid fa-cart-shopping" style="color: white"> </i>
          </button>
        </article>
        <article class="carCard">
          <img src="../../Recursos/hotwheels/LBHauler.webp" alt="LB Hauler" />
          <h1>LB Hauler</h1>
          <h2>Sky Blue</h2>
          <button class="btn">
            Agregar al Carrito
            <i class="fa-solid fa-cart-shopping" style="color: white"> </i>
          </button>
        </article>
      </section>
    </main>
    <footer class="dq3footer">
      <p>Franco Riborati - 2026</p>
      <a href="https://web.whatsapp.com">
        <i class="fa-brands fa-square-whatsapp fa-2xl" style="color: white">
        </i> </a
      ><a href="https://instagram.com/pygmaliongamedesign">
        <i class="fa-brands fa-square-instagram fa-2xl" style="color: white">
        </i>
      </a>
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/Zk8FmFOerAU?si=SrMs-F88CKumHFvv"
        title="YouTube video player"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </footer>
  </body>
</html>
